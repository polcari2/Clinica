<div class="page-container">
  <div class="page-header">
    <h2>Catálogo: Especialidades</h2>
    <a routerLink="/catalogo/especialidades/nueva" class="btn btn-primary">+ Nueva Especialidad</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th style="width: 160px; text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (e of especialidades(); track e.id) {
            <tr>
              <td>{{ e.id }}</td>
              <td><strong>{{ e.nombre }}</strong></td>
              <td>{{ e.descripcion || 'Sin descripción' }}</td>
              <td style="text-align: right;">
                <div class="form-actions" style="justify-content: flex-end;">
                  <a [routerLink]="['/catalogo/especialidades', e.id, 'editar']" class="btn btn-secondary btn-sm">Editar</a>
                  <button (click)="eliminar(e.id!)" class="btn btn-danger btn-sm">Eliminar</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="empty-cell">No se encontraron especialidades registradas.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
