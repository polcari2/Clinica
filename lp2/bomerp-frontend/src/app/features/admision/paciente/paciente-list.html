<div class="page-container">
  <div class="page-header">
    <h2>Admisión: Pacientes</h2>
    <a routerLink="/admision/pacientes/nueva" class="btn btn-primary">+ Nuevo Paciente</a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 80px;">ID</th>
            <th>DNI</th>
            <th>Apellidos y Nombres</th>
            <th>Teléfono</th>
            <th style="width: 160px; text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (p of pacientes(); track p.id) {
            <tr>
              <td>{{ p.id }}</td>
              <td><strong>{{ p.dni }}</strong></td>
              <td>{{ p.apellidos }}, {{ p.nombres }}</td>
              <td>{{ p.telefono || 'Sin teléfono' }}</td>
              <td style="text-align: right;">
                <div class="form-actions" style="justify-content: flex-end;">
                  <a [routerLink]="['/admision/pacientes', p.id, 'editar']" class="btn btn-secondary btn-sm">Editar</a>
                  <button (click)="eliminar(p.id!)" class="btn btn-danger btn-sm">Eliminar</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="empty-cell">No se encontraron pacientes registrados.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
