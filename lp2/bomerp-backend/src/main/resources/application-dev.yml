server:
  port: 8080

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/freepdb1?oracle.jdbc.timezoneAsRegion=false
    username: BOMERP_APP
    password: 123456
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: BOMERP_APP
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.bomerp: DEBUG
